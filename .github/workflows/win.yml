name: Windows
on:
  workflow_dispatch:
    inputs:
      ruby_version:
        description: 'Ruby version to build (blank = all default versions)'
        required: false
        default: '3.3.10'
      build_gems:
        description: 'Also build and package native gems'
        type: boolean
        required: false
        default: false
  # push:
  #   branches: [ main, test/win-ext-arm ]
  # pull_request:
  #   branches: [ main ]
  # release:
  #   types: [published]

env:
  PKG_DATE: 20251122

jobs:
  setup-ruby-versions:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.set-versions.outputs.ruby_versions }}
    steps:
      - name: Set Ruby versions
        id: set-versions
        run: |
          if [ -n "${{ github.event.inputs.ruby_version }}" ]; then
            echo "ruby_versions=['${{ github.event.inputs.ruby_version }}']" >> $GITHUB_OUTPUT
          else
            echo "ruby_versions=['3.2.9','3.3.10','3.4.7']" >> $GITHUB_OUTPUT
          fi

  build-windows:
    needs: [ setup-ruby-versions ]
    defaults:
        run:
          shell: bash
          # shell: msys2 {0}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        arch: [x86_64]
        ruby-version: ${{ fromJson(needs.setup-ruby-versions.outputs.versions) }}
        os: [windows-latest]
        # include:
        #   - os: windows-11-arm
        #     arch: arm64
        #     ruby-version: 3.4.7
      fail-fast: false
    steps:
      # - uses: msys2/setup-msys2@v2
      #   # if: matrix.arch == 'arm64'
      #   with:
      #     msystem: CLANGARM64
      #     path-type: inherit
      #     update: true
      #     release: true
      #     install: >
      #       autotools
      #       mingw-w64-clang-aarch64-clang
          # pacboy: icu:p 7zip:p gcc:p pkg-config:p sqlite3:p libxml2:p libxslt:p libiconv:p libmariadbclient:p libpqxx:p xz:p gcc-libs:p
          # pacboy: icu:p 7zip:p gcc:p pkg-config:p sqlite3:p libxml2:p libxslt:p libiconv:p libmariadbclient:p libpqxx:p xz:p gcc-libs:p
          # pacboy: icu:p 7zip:p ccache:p cmake:p libtool:p openssl:p ncurses:p gmp:p libffi:p libyaml:p sqlite:p xz:p libmariadbclient:p libpqxx:p libssh2:p libxml2:p libxslt:p clang:p cc:p autotools:p doxygen:p graphviz:p gcc-libs:p gdbm:p libyaml:p libffi:p pdcurses:p openssl:p gmp:p tk:p
          
      - uses: actions/checkout@v5
      - name: Cache vendor gems
        id: cache-vendor
        uses: actions/cache@v4
        with:
            path: windows/cache/vendor
            key: windows-vendor-cache-${{ env.PKG_DATE }}-${{ matrix.ruby-version }}-${{ matrix.arch }}-${{ hashFiles(format('shared/gemfiles/{0}/Gemfile.lock', env.PKG_DATE)) }}
            # restore-keys: |
            #   windows-vendor-cache-${{ env.PKG_DATE }}-${{ matrix.ruby-version }}-${{ matrix.arch }}-windows-vendor-cache-${{ env.PKG_DATE }}-

      - name: Cache RubyInstaller archives
        id: cache-rubyinstaller
        uses: actions/cache@v4
        with:
          path: windows/cache/*.7z
          key: windows-rubyinstaller-cache-${{ env.PKG_DATE }}-${{ matrix.ruby-version }}-${{ matrix.arch }}
          # restore-keys: |
          #   windows-rubyinstaller-cache-${{ env.PKG_DATE }}-${{ matrix.ruby-version }}-${{ matrix.arch }}

      - uses: ruby/setup-ruby-pkgs@v1
        # if: matrix.arch != 'arm64'
        with:
          # working-directory: shared/gemfiles/${{ env.PKG_DATE }}
          # msys2: icu-devel
          mingw:             icu 7zip gcc pkg-config sqlite3 libxml2 libxslt libiconv libmariadbclient libpqxx xz gcc-libs gcc openssl
          # mingw:             ccache cmake libtool openssl ncurses gmp libffi libyaml sqlite xz libmariadbclient libpqxx icu libssh2 libxml2 libxslt clang cc autotools doxygen graphviz gcc-libs gdbm libyaml libffi pdcurses openssl gmp tk
          # mingw:             ccache cmake pkg-config libtool openssl ncurses gmp libffi libyaml sqlite xz libmariadbclient libpqxx icu libssh2 libxml2 libxslt clang cc autotools doxygen graphviz gcc-libs gdbm libyaml libffi pdcurses openssl gmp tk
          ruby-version: ${{ matrix.ruby-version }}
          # bundler-cache: true
      # - name: build ruby ${{ matrix.ruby-version }} ${{ matrix.arch }}
      #   # shell: msys2 {0}
      #   if: matrix.arch == 'arm64'
      #   working-directory: windows
      #   run: |
      #       set MSYSTEM=CLANGARM64
      #       ridk install 2 3
      #       ridk enable
      #       uname -m
      #       ridk exec sh -c "mkdir -p cache output/${{ matrix.ruby-version }}/${{ matrix.arch }}"
      #       ridk exec sh -c "./build-ruby.sh -a ${{ matrix.arch }} -r ${{ matrix.ruby-version }} cache output/${{ matrix.ruby-version }}/${{ matrix.arch }}"
      #   env:
      #     RUBY_VERSIONS: ${{ matrix.ruby-version }}
      #     ARCHITECTURES: ${{ matrix.arch }}
      # - name: Setup MSYS2 (CLANGARM64)
      #   uses: msys2/setup-msys2@v2
      #   with:
      #     msystem: CLANGARM64
      #     update: true
      #     release: true
      #     install: >
      #       autotools
      #       mingw-w64-clang-aarch64-clang
      #       ruby
      # - name: Setup RubyInstaller MSYS2 toolchain (arm64)
      #   if: matrix.arch == 'arm64'
      #   working-directory: windows
      #   run: |
      #     # Enable MSYS2 environment
      #     mkdir -p cache output/${{ matrix.ruby-version }}/${{ matrix.arch }}
      #     EXTRACT_ONLY=1 ./build-ruby.sh -a ${{ matrix.arch }} -r ${{ matrix.ruby-version }} cache output/${{ matrix.ruby-version }}/${{ matrix.arch }}
      #     ./output/${{ matrix.ruby-version }}/${{ matrix.arch }}/bin/ridk.cmd enable
      #     # Update MSYS2 and install required build tools
      #     ./output/${{ matrix.ruby-version }}/${{ matrix.arch }}/bin/ridk.cmd exec sh -c "pacman -Syu --noconfirm"
      #     ./output/${{ matrix.ruby-version }}/${{ matrix.arch }}/bin/ridk.cmd exec sh -c "pacman -S --noconfirm make gcc mingw-w64-clang-aarch64-clang"

      - name: Update MSYS2 OpenSSL to latest (3.6.3+)
        shell: bash
        run: |
            if command -v pacman >/dev/null 2>&1; then PAC="pacman"; else PAC="ridk exec pacman"; fi
            echo "Using: $PAC"
            $PAC -Sy --noconfirm
            $PAC -S --noconfirm --needed mingw-w64-ucrt-x86_64-openssl
            /ucrt64/bin/openssl.exe version
      - name: build ruby ${{ matrix.ruby-version }} ${{ matrix.arch }}
        working-directory: windows
        run: |
            uname -m
            mkdir -p cache output/${{ matrix.ruby-version }}/${{ matrix.arch }}
            ./build-ruby.sh -a ${{ matrix.arch }} -r ${{ matrix.ruby-version }} cache output/${{ matrix.ruby-version }}/${{ matrix.arch }}
        env:
          RUBY_VERSIONS: ${{ matrix.ruby-version }}
          ARCHITECTURES: ${{ matrix.arch }}
          SKIP_GEMS: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.build_gems != 'true') && 'true' || 'false' }}
      - name: package ${{ matrix.arch }}
        # shell: bash
        working-directory: windows
        run: |
            ./package.sh -r traveling-ruby-${{ env.PKG_DATE }}-${{ matrix.ruby-version }}-windows-${{ matrix.arch }}.tar.gz output/${{ matrix.ruby-version }}/${{ matrix.arch }}
            if [ "$BUILD_GEMS" = "true" ]; then
              ./package.sh -E traveling-ruby-gems-${{ env.PKG_DATE }}-${{ matrix.ruby-version }}-windows-${{ matrix.arch }} output/${{ matrix.ruby-version }}/${{ matrix.arch }}
              touch traveling-ruby-gems-${{ env.PKG_DATE }}-${{ matrix.ruby-version }}-windows-${{ matrix.arch }}/ok
              ./package.sh -f -r traveling-ruby-${{ env.PKG_DATE }}-${{ matrix.ruby-version }}-windows-${{ matrix.arch }}-full.tar.gz output/${{ matrix.ruby-version }}/${{ matrix.arch }}
            fi
        env:
          RUBY_VERSIONS: ${{ matrix.ruby-version }}
          ARCHITECTURES: ${{ matrix.arch }}
          BUILD_GEMS: ${{ (github.event_name != 'workflow_dispatch' || github.event.inputs.build_gems == 'true') && 'true' || 'false' }}
      - name: test gems
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.build_gems == 'true' }}
        # shell: bash
        working-directory: windows
        run: |
          ../shared/test-gems.sh -p windows -a ${{ matrix.arch }} output/${{ matrix.ruby-version }}/${{ matrix.arch }}
        env:
          RUBY_VERSIONS: ${{ matrix.ruby-version }}
          ARCHITECTURES: ${{ matrix.arch }}
      - name: package gems
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.build_gems == 'true' }}
        # shell: bash
        run: ./scripts/package-gems.sh
        env:
          PLATFORM: windows
      - name: "Upload Artifact - traveling-ruby-${{ env.PKG_DATE }}-${{ matrix.ruby-version }}-windows-${{ matrix.arch }}"
        uses: actions/upload-artifact@v5
        with:
          name: traveling-ruby-${{ env.PKG_DATE }}-${{ matrix.ruby-version }}-windows-${{ matrix.arch}}.tar.gz
          path: windows/*.tar.gz

      - name: Publish archives and packages
        if: ${{ github.event_name == 'release' && github.event.action == 'published' }}
        uses: softprops/action-gh-release@master
        with:
          tag_name: ${{ github.event.release.tag_name }}
          name: 'Release ${{ github.event.release.tag_name }}'
          generate_release_notes: true
          body: ${{ github.event.release.body }}
          files: windows/traveling-ruby-*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test-windows-min:
    needs: [ setup-ruby-versions, build-windows ]
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.build_gems == 'true' }}
    strategy:
      matrix:
        arch: [x86_64]
        ruby-version: ${{ fromJson(needs.setup-ruby-versions.outputs.versions) }}
        os: [windows-latest]
        # include:
        #   - os: windows-11-arm
        #     arch: arm64
        #     ruby-version: 3.4.7
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: "Download Artifact"
        uses: actions/download-artifact@v5
        with:
          name: traveling-ruby-${{ env.PKG_DATE }}-${{ matrix.ruby-version }}-windows-${{ matrix.arch }}.tar.gz
          path: windows/
      - name: "Test binary"
        working-directory: windows
        shell: bash
        run: |
          mkdir output
          tar xzf traveling-ruby-${{ env.PKG_DATE }}-${{ matrix.ruby-version }}-windows-${{ matrix.arch }}.tar.gz -C output
          ../shared/test-gems.sh -p windows -a ${{ matrix.arch }} output
        env:
          RUBY_VERSIONS: ${{ matrix.ruby-version }}
          ARCHITECTURES: ${{ matrix.arch }}
  test-windows-full:
    needs: [ setup-ruby-versions, build-windows ]
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.build_gems == 'true' }}
    strategy:
      matrix:
        arch: [x86_64]
        ruby-version: ${{ fromJson(needs.setup-ruby-versions.outputs.versions) }}
        os: [windows-latest]
        # include:
        #   - os: windows-11-arm
        #     arch: arm64
        #     ruby-version: 3.4.7
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: "Download Artifact"
        uses: actions/download-artifact@v5
        with:
          name: traveling-ruby-${{ env.PKG_DATE }}-${{ matrix.ruby-version }}-windows-${{ matrix.arch }}.tar.gz
          path: windows/
      - name: "Test binary"
        working-directory: windows
        shell: bash
        run: |
          mkdir output
          tar xzf traveling-ruby-${{ env.PKG_DATE }}-${{ matrix.ruby-version }}-windows-${{ matrix.arch }}-full.tar.gz -C output
          ../shared/test-gems.sh -p windows -a ${{ matrix.arch }} output
        env:
          RUBY_VERSIONS: ${{ matrix.ruby-version }}
          ARCHITECTURES: ${{ matrix.arch }}
