name: Linux - x86_64 - build from dockerhub builder

on:
  workflow_dispatch:
    inputs:
      ruby_version:
        description: 'Ruby version to build (blank = all default versions)'
        required: false
        default: '3.3.10'
      build_gems:
        description: 'Also build and package native gems'
        type: boolean
        required: false
        default: false
  # push:
  #   branches: [ main ]
  # pull_request:
  #   branches: [ main ]
  # release:
  #   types: [published]

env:
  PKG_DATE: 20251122

jobs:
  setup-ruby-versions:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.set-versions.outputs.ruby_versions }}
    steps:
      - name: Set Ruby versions
        id: set-versions
        run: |
          if [ -n "${{ github.event.inputs.ruby_version }}" ]; then
            echo "ruby_versions=['${{ github.event.inputs.ruby_version }}']" >> $GITHUB_OUTPUT
          elif [[ "${GITHUB_REF}" == *preview* || "${GITHUB_HEAD_REF}" == *preview* || "${GITHUB_REF_NAME}" == *preview* ]]; then
            echo "ruby_versions=['3.5.0-preview1','4.0.0-preview2']" >> $GITHUB_OUTPUT
          else
            echo "ruby_versions=['3.2.9','3.3.10','3.4.7']" >> $GITHUB_OUTPUT
          fi

  make-linux-x86_64:
    needs: [ setup-ruby-versions ]
    strategy:
      matrix:
        os: [ubuntu-latest]
        ruby-version: ${{ fromJson(needs.setup-ruby-versions.outputs.versions) }}
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: "Set up Ruby"
        uses: ruby/setup-ruby@master
        with:
            ruby-version: ${{ matrix.ruby-version }}
      - name: Build builder image (OpenSSL 3.6.3)
        run: |
            cd linux
            rake image
        env:
          ARCHITECTURES: "x86_64"
      - name: package
        run: |
            cd linux
            rake
            ls
        env:
          ARCHITECTURES: "x86_64"
          RUBY_VERSIONS: ${{ matrix.ruby-version }}
          SKIP_GEMS: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.build_gems != 'true') && 'true' || 'false' }}
      - name: package full (gems)
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.build_gems == 'true' }}
        run: |
            cd linux
            rake package_full
            ls
        env:
          ARCHITECTURES: "x86_64"
          RUBY_VERSIONS: ${{ matrix.ruby-version }}
      - name: package gems
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.build_gems == 'true' }}
        run: ./scripts/package-gems.sh
        env:
          PLATFORM: linux
      - name: 'Upload Artifact - linux x86_64'
        uses: actions/upload-artifact@v5
        with:
          name: traveling-ruby-${{ env.PKG_DATE }}-${{ matrix.ruby-version }}-linux-x86_64.tar.gz
          path: linux/traveling-ruby*.tar.gz
      - name: test
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.build_gems == 'true' }}
        run: |
            cd linux
            rake test_docker
        env:
          ARCHITECTURES: "x86_64"
          RUBY_VERSIONS: ${{ matrix.ruby-version }}

      - name: Publish archives and packages
        if: ${{ github.event_name == 'release' && github.event.action == 'published' }}
        uses: softprops/action-gh-release@master
        with:
          tag_name: ${{ github.event.release.tag_name }}
          name: 'Release ${{ github.event.release.tag_name }}'
          generate_release_notes: true
          body: ${{ github.event.release.body }}
          files: linux/traveling-ruby-*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}